services:

  web:
    build: .
    restart: unless-stopped
    expose:
      - "6000"
    environment:
      FLASK_APP:             run.py
      FLASK_ENV:             ${FLASK_ENV:-production}
      SECRET_KEY:            ${SECRET_KEY:?Set a unique SECRET_KEY in the deployment environment}
      DATABASE_URL:          ${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      AUDIO_STORAGE_PATH:    /app/audio_storage
      AVATAR_STORAGE_PATH:   /app/avatar_storage
      SUPERADMIN_USERNAME:   ${SUPERADMIN_USERNAME:-}
      SUPERADMIN_EMAIL:      ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD:   ${SUPERADMIN_PASSWORD:-}
      PROXY_FIX_X_FOR:       ${PROXY_FIX_X_FOR:-1}
      PROXY_FIX_X_PROTO:     ${PROXY_FIX_X_PROTO:-1}
      PROXY_FIX_X_HOST:      ${PROXY_FIX_X_HOST:-1}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      MAIL_SERVER:           ${MAIL_SERVER:-}
      MAIL_PORT:             ${MAIL_PORT:-587}
      MAIL_USERNAME:         ${MAIL_USERNAME:-}
      MAIL_PASSWORD:         ${MAIL_PASSWORD:-}
    volumes:
      - audio_data_semimus:/app/audio_storage
      - avatar_data_semimus:/app/avatar_storage
    networks:
      - coolify

volumes:
  audio_data_semimus:
  avatar_data_semimus:

networks:
  coolify:
    external: true
