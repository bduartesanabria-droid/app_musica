version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Base de Datos PostgreSQL
  # -------------------------------------------------------------
  postgres-db:
    image: 'postgres:16-alpine'
    container_name: app_musica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_segura}
      POSTGRES_DB: ${POSTGRES_DB:-app_musica}
      TZ: America/Bogota
    volumes:
      - postgres_data_musica:/var/lib/postgresql/data
    networks:
      - app_network
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_musica}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # 2. Aplicación Flask (Web)
  # -------------------------------------------------------------
  web:
    build: .
    container_name: app_musica_web
    restart: unless-stopped
    expose:
      - "6000"
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-app_musica_secret_key_production_2026}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_segura}@postgres-db:5432/${POSTGRES_DB:-app_musica}
      AUDIO_STORAGE_PATH: /app/audio_storage
      AVATAR_STORAGE_PATH: /app/avatar_storage
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@example.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-Admin123456!}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      PROXY_FIX_X_FOR: 1
      PROXY_FIX_X_PROTO: 1
      PROXY_FIX_X_HOST: 1
    volumes:
      - audio_data_semimus:/app/audio_storage
      - avatar_data_semimus:/app/avatar_storage
    networks:
      - app_network
      - coolify

  # -------------------------------------------------------------
  # 3. Respaldo Automático de Base de Datos
  # -------------------------------------------------------------
  postgres-backup:
    image: 'prodrigestivill/postgres-backup-local:16-alpine'
    container_name: app_musica_backup
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_DB: ${POSTGRES_DB:-app_musica}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_segura}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: America/Bogota
    volumes:
      - postgres_backups_musica:/backups
    networks:
      - app_network

volumes:
  postgres_data_musica:
  postgres_backups_musica:
  audio_data_semimus:
  avatar_data_semimus:

networks:
  app_network:
    driver: bridge
  coolify:
    external: true
